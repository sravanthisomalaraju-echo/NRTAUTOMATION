name: NRT Validator + SLA Check

# "AI proposes, code validates": applies AI proposals written to Test_Queue_Master
# after checking them, and runs the SLA drift check. GitHub may start runs a few
# minutes late; that is fine for a 2 h / 24 h SLA.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the sheet (uncheck for a dry run)"
        type: boolean
        default: true

concurrency:
  group: nrt-validator
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install gspread google-auth google-auth-oauthlib python-dotenv requests
      - name: Google auth token
        run: echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json
      - name: Run validator
        env:
          PROVISIONING_WEBHOOK_URL: ${{ secrets.PROVISIONING_WEBHOOK_URL }}
          REVIEW_WEBHOOK_URL: ${{ secrets.REVIEW_WEBHOOK_URL }}
          AI_CONFIDENCE_THRESHOLD: '0.8'
          SLA_ACK_HOURS: '2'
          SLA_DONE_HOURS: '24'
          SLA_TEST_HOURS: '24'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" != "true" ]; then
            python -u validate_ai_proposals.py
          else
            python -u validate_ai_proposals.py --apply
          fi
